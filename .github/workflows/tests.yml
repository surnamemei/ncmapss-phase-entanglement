name: Data-free repository tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools used by the manuscript checks
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install CPU-only dependencies pinned in requirements-lock.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install $(grep -v -e '^#' -e '^torch' -e '^$' requirements-lock.txt)
      - name: Run the data-free public test suite (CUDA tests skip on CPU runners)
        run: python scripts/run_public_tests.py -v
